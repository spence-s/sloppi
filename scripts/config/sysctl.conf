# Protect FIFOs in shared sticky directories, including group-owned ones.
fs.protected_fifos = 2
# Prevent hard links to files the caller does not own or control.
fs.protected_hardlinks = 1
# Protect regular files in user- and group-writable sticky directories.
fs.protected_regular = 2
# Refuse unsafe symlink traversal in shared sticky directories.
fs.protected_symlinks = 1
# Keep privilege-changing programs from leaking memory through core dumps.
fs.suid_dumpable = 0
# Hide kernel logs from unprivileged users.
kernel.dmesg_restrict = 1
# Hide kernel pointer addresses, including from privileged readers.
kernel.kptr_restrict = 2
# Restrict performance counters that can expose processes and kernel state.
kernel.perf_event_paranoid = 3
# Disable unprivileged BPF until reboot; privileged BPF remains available.
kernel.unprivileged_bpf_disabled = 1
# Allow tracing descendants, but not arbitrary same-user processes.
kernel.yama.ptrace_scope = 1
