#!/usr/sbin/nft -f
flush ruleset

table inet sloppi {
  set non_public_ipv4 {
    type ipv4_addr
    flags interval
    elements = {
      0.0.0.0/8,
      10.0.0.0/8,
      100.64.0.0/10,
      127.0.0.0/8,
      169.254.0.0/16,
      172.16.0.0/12,
      192.0.0.0/24,
      192.0.2.0/24,
      192.168.0.0/16,
      198.18.0.0/15,
      198.51.100.0/24,
      203.0.113.0/24,
      224.0.0.0/4,
      240.0.0.0/4
    }
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    iifname "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    tcp dport 22 accept
    reject with icmpx type port-unreachable
  }

  chain output {
    type filter hook output priority filter; policy accept;
    ct state established,related accept
    oifname "lo" accept
    udp sport 68 udp dport 67 accept
    udp sport 546 udp dport 547 accept
    ip daddr { 192.168.5.2, 192.168.5.3 } meta l4proto { tcp, udp } th dport 53 accept
    ip daddr 192.168.5.2 tcp dport 5432 accept
    ip daddr @non_public_ipv4 counter reject with icmp type admin-prohibited
    meta nfproto ipv4 meta skuid "sloppi-proxy" tcp dport { 80, 443 } accept
    meta nfproto ipv6 counter reject with icmpv6 type admin-prohibited
    meta nfproto ipv4 counter reject with icmp type admin-prohibited
  }
}
