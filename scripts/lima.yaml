base: template:_images/ubuntu

env:
  COLORTERM: truecolor

mounts:
  - location: ~/Projects
    writable: true

  - location: ~/.pi
    mountPoint: /home/spencer.guest/.pi
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/sh
      apt-get update
      apt-get install -y \
        bat build-essential curl dnsutils eza fd-find file fzf git jq lsof \
        netcat-openbsd procps psmisc python3 python3-pip ripgrep shellcheck \
        sqlite3 tmux tree unzip wget yq zip zoxide
      ln -sf /usr/bin/batcat /usr/local/bin/bat
      ln -sf /usr/bin/fdfind /usr/local/bin/fd

  - mode: user
    script: |
      #!/bin/sh
      export N_PREFIX="$HOME/n"
      export PATH="$N_PREFIX/bin:$PATH"
      curl -L https://bit.ly/n-install | bash -s -- -y -
      n lts
      npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      sudo ln -sf "$N_PREFIX/bin/"* /usr/local/bin/

      git config --global user.name 'Pi Agent'
      git config --global user.email 'pi-agent@localhost'
      git config --global commit.gpgsign false
