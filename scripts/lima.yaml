base: template:_images/ubuntu

env:
  COLORTERM: truecolor

containerd:
  system: false
  user: false

hostResolver:
  enabled: true
  ipv6: false

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false

portForwards:
  - guestPort: 39081
    ignore: true
  - guestPort: 8081
    hostIP: 127.0.0.1
    hostPort: 8081

mounts:
  - location: ~/Projects
    writable: true

  - location: ~/.pi
    mountPoint: /home/spencer.guest/.pi
    writable: true

provision:
  - mode: data
    path: /usr/local/sbin/sloppi-mount-node-modules
    file:
      url: ./provision/mount-node-modules.py
    permissions: 755

  - mode: data
    path: /usr/local/sbin/sloppi-allow-request
    file:
      url: ./provision/allow-request.py
    permissions: 755

  - mode: data
    path: /etc/sudoers.d/90-cloud-init-users
    file:
      url: ./config/sudoers.conf
    permissions: 440

  - mode: data
    path: /etc/sysctl.d/90-sloppi-hardening.conf
    file:
      url: ./config/sysctl.conf
    permissions: 644

  - mode: data
    path: /etc/security/limits.d/90-sloppi-hardening.conf
    file:
      url: ./config/limits.conf
    permissions: 644

  - mode: data
    path: /etc/systemd/coredump.conf.d/90-sloppi-hardening.conf
    file:
      url: ./config/coredump.conf
    permissions: 644

  - mode: data
    path: /etc/ssh/sshd_config.d/90-sloppi-hardening.conf
    file:
      url: ./config/sshd.conf
    permissions: 644

  - mode: data
    path: /etc/nftables.conf
    file:
      url: ./config/nftables.conf
    permissions: 644

  - mode: data
    path: /etc/sloppi/egress-domains
    file:
      url: ./config/egress-domains.conf
    permissions: 644

  - mode: data
    path: /etc/sloppi/proxy-environment
    file:
      url: ./config/proxy-environment.conf
    permissions: 644

  - mode: data
    path: /etc/sloppi/proxy.py
    file:
      url: ./config/proxy.py
    permissions: 644

  - mode: data
    path: /etc/systemd/system/sloppi-proxy.service
    file:
      url: ./config/proxy.service
    permissions: 644

  - mode: system
    file:
      url: ./provision/system.sh

  - mode: user
    file:
      url: ./provision/user.sh
