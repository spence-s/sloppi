base: template:_images/ubuntu

env:
  COLORTERM: truecolor

mounts:
  - location: ~/Projects
    writable: true

  - location: ~/.pi
    mountPoint: /home/spencer.guest/.pi
    writable: true

  - location: ~/.lima-git
    mountPoint: /home/spencer.guest/.lima-git
    writable: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      apt-get update
      apt-get install -y \
        bat build-essential curl eza fd-find fzf git jq python3 python3-pip \
        ripgrep tmux tree unzip wget zip zoxide
      ln -sf /usr/bin/batcat /usr/local/bin/bat
      ln -sf /usr/bin/fdfind /usr/local/bin/fd

  - mode: user
    script: |
      #!/bin/sh
      export N_PREFIX="$HOME/n"
      export PATH="$N_PREFIX/bin:$PATH"
      curl -L https://bit.ly/n-install | bash -s -- -y -
      n lts
      npm install -g --ignore-scripts @earendil-works/pi-coding-agent
      sudo ln -sf "$N_PREFIX/bin/"* /usr/local/bin/
      printf '[include]\n\tpath = %s/.lima-git/config\n' "$HOME" > "$HOME/.gitconfig"
